<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>QR Code Generator</title>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #e2e8f0;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text: #f8fafc;
        --subtext: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --primary-hover: #60a5fa;
        --primary-light: rgba(59, 130, 246, 0.15);
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .brand-icon {
      font-size: 16px;
    }
    .btn-link {
      background: transparent;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .btn-link:hover {
      background: var(--primary-light);
    }
    .qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px;
      width: 180px;
      height: 180px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .qr-container canvas, .qr-container img {
      max-width: 100%;
      height: auto;
      display: block;
    }
    .url-box {
      font-size: 11px;
      color: var(--subtext);
      word-break: break-all;
      background: var(--card-bg);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      max-height: 48px;
      overflow-y: auto;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }
    .btn-sm {
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-sm:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .btn-primary {
      width: 100%;
      padding: 9px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .notice-box {
      display: none;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: center;
      margin-bottom: 12px;
      color: var(--subtext);
    }
  </style>
  <script src="qrcode.min.js"></script>
  <script src="popup.js"></script>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">🔳</span>
      <span>QR Code Tool</span>
    </div>
    <button id="btn-open-options" class="btn-link" title="打开高级配置页">
      ⚙️ 配置页
    </button>
  </div>

  <div id="restricted-notice" class="notice-box">
    当前处于浏览器受保护页面，已为您就绪全功能工作台。
  </div>

  <div id="qr-wrapper" class="qr-container">
    <div id="qrcode"></div>
  </div>

  <div id="url-display" class="url-box">正在获取当前页面网址...</div>

  <div class="action-row">
    <button id="btn-copy-url" class="btn-sm">📋 复制链接</button>
    <button id="btn-download" class="btn-sm">📥 保存图片</button>
  </div>

  <button id="btn-open-studio" class="btn-primary">
    🚀 打开高阶定制工作台 (Studio)
  </button>
</body>
</html>
